name: Collect market snapshots

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: collect-market
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect snapshot
        run: python3 collector/collect_market.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/
          if ! git diff --cached --quiet; then
            git commit -m "Market snapshot update"
            git push
          else
            echo "No changes to commit."
          fi

      # Self-reporting: if the collector fails, an issue is opened on the
      # repo so the breakage is never silent (GitHub also emails the
      # account owner when a workflow run fails).
      - name: Open an issue on failure
        if: failure()
        run: |
          gh issue create \
            --title "Market collection failed" \
            --body "The scheduled collector run failed (run ${{ github.run_id }}). The existing data was left untouched; check the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "collector-failure" || \
          gh issue create \
            --title "Market collection failed" \
            --body "The scheduled collector run failed (run ${{ github.run_id }}). The existing data was left untouched; check the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
